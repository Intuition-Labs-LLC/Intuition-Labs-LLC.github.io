:root{color-scheme:light;background:#faf9f5;color:#14211f;font-family:Holding,system-ui,sans-serif;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;overflow-x:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.52;mask-image:radial-gradient(ellipse at 50% 44%,transparent 24%,#0003 51%,#000 90%)}
main{position:relative;z-index:1;max-width:100%;padding:40px 24px;text-align:center;transform:translateY(-1.5vh)}
h1{font-weight:450;line-height:1.3;margin:0;letter-spacing:-.035em;font-size:clamp(21px,2.05vw,29px)}
.noun-slot{display:grid;margin-top:20px;font-size:clamp(42px,5vw,65px);font-weight:500;line-height:1.17;letter-spacing:-.055em}
.noun-slot>span{grid-area:1/1}.measure{visibility:hidden;pointer-events:none}
.lab-link{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:44px;margin-top:38px;color:inherit;font-size:clamp(16px,1.55vw,22px);text-decoration:none;border-bottom:1px solid #526059;padding:2px 0;cursor:pointer;transition:color .3s}
.lab-link:hover{color:#547448;border-color:currentColor}.lab-link svg{width:18px;height:18px}
button{font:inherit;cursor:pointer;color:#526059;background:transparent;border:0;font-size:12px;min-height:44px;padding:12px 16px}
button:hover{color:#14211f}button:focus-visible,a:focus-visible{outline:2px solid #284f3d;outline-offset:6px}
.pause{position:fixed;z-index:2;right:16px;bottom:max(10px,env(safe-area-inset-bottom));opacity:.8}
@media(max-width:480px){main{padding:28px 18px}h1{font-size:21px}.noun-slot{font-size:46px;margin-top:16px}.lab-link{font-size:16px;margin-top:32px}.pause{right:8px;font-size:11px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.pause{display:none}}
@media(forced-colors:active){canvas{display:none}.lab-link{border-color:LinkText}}
