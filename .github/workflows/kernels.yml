name: Kernels CI

on:
  push:
    paths:
      - "kernels/**"
      - ".github/workflows/kernels.yml"
  pull_request:
    paths:
      - "kernels/**"
      - ".github/workflows/kernels.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    name: Static contract and planner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kernels
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate the example work order
        run: >-
          python3 kernel-workbench/scripts/kernel_workbench.py validate
          kernel-workbench/examples/cuda-to-hip-strix-halo.v1.json

      - name: Resolve the example plan
        run: >-
          python3 kernel-workbench/scripts/kernel_workbench.py plan
          kernel-workbench/examples/cuda-to-hip-strix-halo.v1.json

      - name: Validate the generated HIPIFY mapping object
        run: >-
          python3 skills/port-cuda-to-hip/scripts/hipify_api_catalog.py validate
          skills/port-cuda-to-hip/assets/hipify-api-catalog.json
